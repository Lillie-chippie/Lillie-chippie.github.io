<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería IG Optimizada</title>

<style>
:root {
    --radius: 12px;
}

/* RESET BÁSICO */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
}

h2 {
    text-align: center;
    margin-bottom: 16px;
    font-weight: 500;
}

/* GRID */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 📱 móvil */
    gap: 12px;
}

/* 🖥️ desktop */
@media (min-width: 768px) {
    .gallery {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* ITEM 1:1 (iframe-safe) */
.gallery-item {
    position: relative;
    width: 100%;
    padding-top: 100%;
    overflow: hidden;
    border-radius: var(--radius);
    background: #1c1c1c;
}

/* SHIMMER OSCURO */
.gallery-item::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        #1c1c1c 25%,
        #2a2a2a 37%,
        #1c1c1c 63%
    );
    background-size: 400% 100%;
    animation: shimmer 1.2s linear infinite;
    z-index: 1;
}

/* IMAGEN */
.gallery-item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.03);
    transition: opacity .3s ease, transform .3s ease;
}

/* CARGADA */
.gallery-item.loaded img {
    opacity: 1;
    transform: scale(1);
}

.gallery-item.loaded::before {
    opacity: 0;
    animation: none;
}

/* HOVER SUAVE (solo desktop) */
@media (hover: hover) {
    .gallery-item:hover img {
        transform: scale(1.05);
    }
}

@keyframes shimmer {
    to { background-position: -400% 0; }
}
</style>
</head>

<body>

<h2>Galería IG</h2>
<div class="gallery" id="gallery"></div>

<script>
(() => {

    const images = [
        'images/555.jpg',
        'images/571284014_1415632473418984_8013318232030679594_n.jpg',
        'images/B612_20240424_173904_236.jpg',
        'images/B612_20240720_015655_157.jpg',
        'images/B612_20240728_233309_730.jpg',
        'images/B612_20240810_175045_494.jpg',
        'images/B612_20241028_114613_301.jpg',
        'images/B612_20241125_233734_410.jpg',
        'images/B612_20250124_234239_544.jpg',
        'images/B612_20251027_012347_449.jpg',
        'images/IMG_20240420_190055.jpg',
        'images/IMG_20240713_151414.jpg',
        'images/PicsArt_12-11-01.43.42.jpg'
    ];

    const MAX_IMAGES = 6;
    const gallery = document.getElementById('gallery');

    /* SHUFFLE SIMPLE */
    const shuffle = arr =>
        arr.sort(() => Math.random() - 0.5);

    /* PERSISTENCIA POR SESIÓN */
    const selected = JSON.parse(
        sessionStorage.getItem('galleryImages')
    ) || shuffle([...images]).slice(0, MAX_IMAGES);

    sessionStorage.setItem(
        'galleryImages',
        JSON.stringify(selected)
    );

    /* INTERSECTION OBSERVER */
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;

            const wrapper = entry.target;
            const src = wrapper.dataset.src;

            const img = new Image();
            img.src = src;
            img.alt = src.split('/').pop().replace(/[-_]/g, ' ');
            img.decoding = 'async';

            img.onload = () => wrapper.classList.add('loaded');

            img.onerror = () => {
                img.src =
                    'data:image/svg+xml;charset=UTF-8,' +
                    '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">' +
                    '<rect width="100%" height="100%" fill="%23222222"/>' +
                    '<text x="50%" y="50%" fill="%23999" font-size="18" ' +
                    'text-anchor="middle" dominant-baseline="middle">' +
                    'Imagen no disponible</text></svg>';
                wrapper.classList.add('loaded');
            };

            wrapper.appendChild(img);
            observer.unobserve(wrapper);
        });
    }, {
        rootMargin: '200px'
    });

    /* CREACIÓN DIFERIDA */
    selected.forEach(src => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.dataset.src = src;
        observer.observe(item);
        gallery.appendChild(item);
    });

})();
</script>

</body>
</html>
