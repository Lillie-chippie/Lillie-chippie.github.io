<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .gallery img { width: 100%; height: auto; }
    </style>
</head>
<body>
    <h1>Galería de Imágenes Nuevas</h1>
    <div class="gallery" id="gallery"></div>

    <script>
        const images = [
            'path/to/image1.jpg',
            'path/to/image2.jpg',
            'path/to/image3.jpg',
            // Agregar más imágenes según sea necesario
        ];

        // Randomly select images to display
        function displayRandomImages() {
            const gallery = document.getElementById('gallery');
            const imageCount = images.length;
            const displayedImagesIndex = new Set();
            const maxToShow = Math.min(6, imageCount); // Max 6 images

            while (displayedImagesIndex.size < maxToShow) {
                const randomIndex = Math.floor(Math.random() * imageCount);
                displayedImagesIndex.add(randomIndex);
            }

            displayedImagesIndex.forEach(index => {
                const img = document.createElement('img');
                img.src = images[index];
                gallery.appendChild(img);
            });
        }

        displayRandomImages();
    </script>
</body>
</html>
