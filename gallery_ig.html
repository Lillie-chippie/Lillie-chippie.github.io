<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería IG</title>

<style>
:root {
    --radius: 12px;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background: #fff;
}

h2 {
    text-align: center;
    margin-bottom: 16px;
}

/* GRID */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
}

/* WRAPPER para mantener 1:1 perfecto */
.gallery-item {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1; /* CUADRADO REAL */
    overflow: hidden;
    border-radius: var(--radius);
    background: #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

/* SHIMMER + BLUR */
.gallery-item::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        #eee,
        #f5f5f5,
        #eee
    );
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    z-index: 1;
}

/* IMAGEN */
.gallery img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover; /* IG style */
    opacity: 0;
    filter: blur(14px);
    transform: scale(1.05);
    transition:
        opacity .45s ease,
        filter .45s ease,
        transform .45s ease;
}

/* CARGADA */
.gallery-item.loaded img {
    opacity: 1;
    filter: blur(0);
    transform: scale(1);
}

.gallery-item.loaded::before {
    animation: none;
    opacity: 0;
}

/* HOVER IG */
.gallery img:hover {
    transform: scale(1.06);
}

/* SHIMMER */
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
</style>
</head>

<body>
<h2>Galería IG</h2>
<div class="gallery" id="gallery"></div>

<script>
(function () {

    const images = [
        'images/555.jpg',
        'images/571284014_1415632473418984_8013318232030679594_n.jpg',
        'images/B612_20240424_173904_236.jpg',
        'images/B612_20240720_015655_157.jpg',
        'images/B612_20240728_233309_730.jpg',
        'images/B612_20240810_175045_494.jpg',
        'images/B612_20241028_114613_301.jpg',
        'images/B612_20241125_233734_410.jpg',
        'images/B612_20250124_234239_544.jpg',
        'images/B612_20251027_012347_449.jpg',
        'images/IMG_20240420_190055.jpg',
        'images/IMG_20240713_151414.jpg',
        'images/PicsArt_12-11-01.43.42.jpg'
    ];

    const maxImages = 6;
    const gallery = document.getElementById('gallery');

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Persistencia por sesión
    let selected = sessionStorage.getItem('galleryImages');
    selected = selected
        ? JSON.parse(selected)
        : shuffle([...images]).slice(0, maxImages);

    sessionStorage.setItem('galleryImages', JSON.stringify(selected));

    const fragment = document.createDocumentFragment();

    selected.forEach(src => {
        const wrapper = document.createElement('div');
        wrapper.className = 'gallery-item';

        const img = document.createElement('img');
        img.src = src;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.width = 500;
        img.height = 500;
        img.alt = src.split('/').pop().replace(/[-_]/g, ' ');

        img.onload = () => wrapper.classList.add('loaded');

        img.onerror = () => {
            img.src = 'data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="%23ddd"/><text x="50%" y="50%" font-size="20" fill="%23666" text-anchor="middle" dominant-baseline="middle">Imagen no disponible</text></svg>';
            wrapper.classList.add('loaded');
        };

        wrapper.appendChild(img);
        fragment.appendChild(wrapper);
    });

    gallery.appendChild(fragment);

})();
</script>
</body>
</html>
