<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Feed - Static</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: transparent;
            padding: 10px;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 1px solid #333;
            transition: border 0.3s;
        }

        .grid-item:hover {
            border-color: #f0f;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .grid-item:hover img {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="grid">
        <div class="grid-item"><img src="images/555.jpg" alt="555"></div>
        <div class="grid-item"><img src="images/571284014_1415632473418984_8013318232030679594_n.jpg" alt="571284"></div>
        <div class="grid-item"><img src="images/B612_20240424_173904_236.jpg" alt="B612_20240424"></div>
        <div class="grid-item"><img src="images/B612_20240720_015655_157.jpg" alt="B612_20240720"></div>

        <div class="grid-item"><img src="images/B612_20241125_233734_410.jpg" alt="B612_20241125"></div>
        <div class="grid-item"><img src="images/B612_20250124_234239_544.jpg" alt="B612_20250124"></div>
        <div class="grid-item"><img src="images/B612_20251027_012347_449.jpg" alt="B612_20251027"></div>
        <div class="grid-item"><img src="images/IMG_20240420_190055.jpg" alt="IMG_20240420"></div>
