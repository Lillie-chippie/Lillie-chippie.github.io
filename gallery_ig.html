<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Feed - Static</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: transparent;
            padding: 10px;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 1px solid #333;
            transition: border 0.3s;
        }

        .grid-item:hover {
            border-color: #f0f;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .grid-item:hover img {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="grid">
        <div class="grid-item"><img src="images/madoka_aesthetic_1768426567425.png" alt="Madoka"></div>
        <div class="grid-item"><img src="images/harajuku_fit_1768426584925.png" alt="Harajuku"></div>
        <div class="grid-item"><img src="images/cyber_electronics_1768426601780.png" alt="Cyber"></div>
        <div class="grid-item"><img src="images/chiptune_vibes_1768426618252.png" alt="Chiptune"></div>
        <div class="grid-item"><img src="images/ai_art_anime_1768426634075.png" alt="AI Art"></div>
    </div>
</body>

</html>
