<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Feed - Static</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: transparent;
            padding: 10px;
            color: #fff;
        }

        .tweet {
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(30, 30, 30, 0.5);
            border-radius: 8px;
        }

        .tweet h4 {
            margin: 0 0 5px 0;
            color: #00acee;
        }

        .tweet p {
            margin: 0;
            font-size: 0.9em;
            line-height: 1.4;
            color: #ccc;
        }
    </style>
</head>

<body>
    <div class="tweet">
        <h4>@lillie-chippie</h4>
        <p>A puro html baby... 💻✨ #RetroComputing #Cyberpunk</p>
    </div>
    <div class="tweet">
        <h4>@lillie-chippie</h4>
        <p>Componiendo algo nuevo con LSDJ hoy. ¡El sonido de 8 bits nunca envejece! 🎶👾</p>
    </div>
    <div class="tweet">
        <h4>@lillie-chippie</h4>
        <p>¿Madoka Magica es un anime de niñas mágicas o un thriller psicológico? Discusión seria. 🎀💀</p>
    </div>
</body>

</html>
